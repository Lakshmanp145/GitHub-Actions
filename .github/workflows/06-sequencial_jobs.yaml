name: Parallel #workflow
on: [push] #events like push, crete PR, create an issue
concurrency: #cancel first one runs recent changes
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs: # a workflow can have multiple pipelines
  job-1:
    runs-on: ubuntu-latest
    steps:
      - name: step1
        run: echo "Hi Iam from parallel job-1"
      
  job-2:
    needs: job-1
    runs-on: ubuntu-latest
    steps:
      - name: step1
        run: echo "Hi Iam from parallel job-2"
      
  job-3:
    needs: job-2
    runs-on: ubuntu-latest
    steps:
      - name: step1
        run: echo "Hi Iam from parallel job-3"
      
  job-4:
    runs-on: ubuntu-latest
    steps:
      - name: step1
        run: echo "Hi Iam from parallel job-4"